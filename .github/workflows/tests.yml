name: Python tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,dev]"
          python -m playwright install --with-deps chromium
      - name: Run unit tests
        run: |
          mkdir -p test-results
          pytest tests/unit --junitxml=test-results/unit-junit.xml --html=test-results/unit-report.html --self-contained-html
      - name: Run browser tests
        run: pytest tests/e2e --junitxml=test-results/e2e-junit.xml --html=test-results/e2e-report.html --self-contained-html
      - name: Lint
        run: ruff check .
      - name: Upload test reports and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shopscope-test-results-python-${{ matrix.python-version }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
