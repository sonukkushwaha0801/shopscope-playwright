<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopScope Demo Store</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 3rem auto; padding: 0 1rem; color: #172033; }
    form { display: flex; gap: .5rem; margin: 1.5rem 0; }
    input, button { font: inherit; padding: .6rem .8rem; }
    input { flex: 1; }
    .products { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    article { border: 1px solid #d7dce5; border-radius: .7rem; padding: 1rem; }
    .price { font-weight: 700; }
    #status { min-height: 1.5rem; }
  </style>
</head>
<body>
  <header>
    <h1>ShopScope Demo Store</h1>
    <p>Controlled local storefront for automation tests. No external service or purchase is involved.</p>
    <p>Cart items: <strong data-testid="cart-count">0</strong></p>
  </header>
  <form role="search">
    <label for="search">Search products</label>
    <input id="search" type="search" aria-label="Search products" placeholder="Search products">
    <button type="submit">Search</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <section class="products" aria-label="Products">
    <article data-testid="product-card" data-name="Everyday Backpack">
      <h2>Everyday Backpack</h2><p class="price">₹1,499</p>
      <p>Durable everyday carry bag.</p><button type="button" data-add="Everyday Backpack">Add to cart</button>
    </article>
    <article data-testid="product-card" data-name="Wireless Mouse">
      <h2>Wireless Mouse</h2><p class="price">₹799</p>
      <p>Compact wireless mouse.</p><button type="button" data-add="Wireless Mouse">Add to cart</button>
    </article>
    <article data-testid="product-card" data-name="USB-C Hub">
      <h2>USB-C Hub</h2><p class="price">₹1,199</p>
      <p>Multiport USB-C adapter.</p><button type="button" data-add="USB-C Hub">Add to cart</button>
    </article>
  </section>
  <script>
    const form = document.querySelector('form');
    const input = document.querySelector('#search');
    const cards = [...document.querySelectorAll('[data-testid="product-card"]')];
    const status = document.querySelector('#status');
    const cartCount = document.querySelector('[data-testid="cart-count"]');
    let count = 0;
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const query = input.value.trim().toLowerCase();
      let visible = 0;
      for (const card of cards) {
        const matches = card.dataset.name.toLowerCase().includes(query);
        card.hidden = !matches;
        if (matches) visible += 1;
      }
      status.textContent = query ? (visible ? visible + ' product(s) found.' : 'No products found.') : 'Showing all products.';
    });
    document.querySelectorAll('[data-add]').forEach((button) => {
      button.addEventListener('click', () => {
        count += 1;
        cartCount.textContent = String(count);
        status.textContent = button.dataset.add + ' added to cart.';
      });
    });
  </script>
</body>
</html>
